name: Publish Tianxia Wuzhu Web Release

on:
  push:
    tags:
      - "v*-web"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release payload
        uses: actions/checkout@v6

      - name: Verify runtime and package Web release
        shell: bash
        run: python3 .github/scripts/package_web_release.py --tag "$GITHUB_REF_NAME"

      - name: Verify public download checksums
        working-directory: .release-output
        run: sha256sum --check CHECKSUMS.sha256

      - name: Create public development release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("web-build-manifest.json", encoding="utf-8-sig"))["build_version"])')"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "天下无主 v${VERSION} · 地图、粮运与天下归心" \
            --notes-file ".release-output/RELEASE-NOTES.md" \
            --latest \
            .release-output/*
